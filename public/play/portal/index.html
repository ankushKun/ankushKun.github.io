<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Alive</title>
<!-- The "Still Alive" floppy demo booted on v86 (copy.sh/v86, BSD-2-Clause), all files self-hosted. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { display: grid; place-items: center; width: 100%; height: 100%; }
  #screen > div { grid-area: 1 / 1; white-space: pre; font: 14px/1 monospace; color: #ccc; }
  #screen canvas { grid-area: 1 / 1; display: none; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; height: 100%; object-fit: contain; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="screen"><div></div><canvas></canvas></div>
<script src="libv86.js"></script>
<script>
  new V86({
    wasm_path: 'v86.wasm',
    memory_size: 32 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    screen_container: document.getElementById('screen'),
    bios: { url: 'seabios.bin' },
    vga_bios: { url: 'vgabios.bin' },
    fda: { url: 'stillalive.img' },
    autostart: true,
  });
</script>
</body>
</html>
