{{/* Paint - a shared MacPaint-style canvas everyone draws on together */}}
{{- $id := .id -}}
<div id="content-{{ $id }}" class="window-content" data-paint-window="true">
    <div class="paint-window">

        <div class="paint-toolbar">
            <div class="paint-tools" role="radiogroup" aria-label="Tool">
                <button type="button" class="paint-tool is-selected" data-tool="pencil" data-tip="Pencil"
                    role="radio" aria-checked="true" aria-label="Pencil">
                    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                        <path d="M3 17l1-4L14.5 2.5a1.8 1.8 0 0 1 2.5 2.5L6.5 15.5z" fill="none"
                            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    </svg>
                </button>
                <button type="button" class="paint-tool" data-tool="eraser" data-tip="Eraser"
                    role="radio" aria-checked="false" aria-label="Eraser">
                    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                        <path d="M7 16h9M4.5 13.5l6-6a1.8 1.8 0 0 1 2.5 0l3 3a1.8 1.8 0 0 1 0 2.5l-3.5 3.5H7z"
                            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <div class="paint-sizes" role="radiogroup" aria-label="Brush size">
                <button type="button" class="paint-size" data-size="2" role="radio" aria-checked="false"
                    aria-label="Thin"><span style="width:3px;height:3px"></span></button>
                <button type="button" class="paint-size is-selected" data-size="4" role="radio" aria-checked="true"
                    aria-label="Medium"><span style="width:6px;height:6px"></span></button>
                <button type="button" class="paint-size" data-size="9" role="radio" aria-checked="false"
                    aria-label="Thick"><span style="width:11px;height:11px"></span></button>
                <button type="button" class="paint-size" data-size="18" role="radio" aria-checked="false"
                    aria-label="Fat"><span style="width:17px;height:17px"></span></button>
            </div>

            <div class="paint-palette" role="radiogroup" aria-label="Colour"></div>

            <div class="paint-toolbar-end">
                <span class="paint-status">Connecting…</span>
                <button type="button" class="paint-clear" data-tip="Erase the whole canvas">Clear</button>
            </div>
        </div>

        <div class="paint-stage">
            <canvas class="paint-canvas" width="960" height="600"></canvas>
            <div class="paint-loading">Loading canvas…</div>
        </div>

        <p class="paint-note">Everyone here draws on the same canvas. Be nice to each other's work.</p>
    </div>
</div>
