{{/* DOOM game icon - visible at desktop, Finder grid, Spotlight, and window chrome sizes. */}}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
    <defs>
        <linearGradient id="doomTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#3b1414" />
            <stop offset="52%" style="stop-color:#171717" />
            <stop offset="100%" style="stop-color:#050505" />
        </linearGradient>
        <linearGradient id="doomRed" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ff5a2f" />
            <stop offset="50%" style="stop-color:#d71914" />
            <stop offset="100%" style="stop-color:#7a0705" />
        </linearGradient>
        <filter id="doomDrop" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.38" />
        </filter>
    </defs>

    <g filter="url(#doomDrop)">
        <rect x="7" y="8" width="50" height="48" rx="10" fill="url(#doomTileBg)" />
        <rect x="8" y="9" width="48" height="22" rx="9" fill="rgba(255,255,255,0.08)" />
        <rect x="7.5" y="8.5" width="49" height="47" rx="9.5" fill="none" stroke="rgba(255,255,255,0.16)" />

        <g transform="translate(32 33)">
            <text x="0" y="5" text-anchor="middle"
                font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif"
                font-size="19" font-weight="900" letter-spacing="-1.2"
                fill="url(#doomRed)" stroke="#2a0000" stroke-width="0.8"
                paint-order="stroke fill" style="text-rendering: geometricPrecision">DOOM</text>
            <path d="M-21 13 L21 13" stroke="#ffb14a" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
        </g>
    </g>
</svg>
