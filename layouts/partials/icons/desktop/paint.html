{{/* Paint icon - MacPaint-flavoured palette and brush */}}
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
        <linearGradient id="pt-paper" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e6e9ed" />
        </linearGradient>
        <linearGradient id="pt-handle" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c98b52" />
            <stop offset="100%" stop-color="#8f5c2c" />
        </linearGradient>
    </defs>

    <rect x="7" y="7" width="50" height="50" rx="6" fill="url(#pt-paper)" stroke="#b7bec6" stroke-width="1.5" />

    <!-- paint splotches -->
    <circle cx="21" cy="21" r="6" fill="#e0524a" />
    <circle cx="34" cy="18" r="5" fill="#4a90e2" />
    <circle cx="45" cy="24" r="5.5" fill="#f0c419" />
    <circle cx="20" cy="34" r="5" fill="#5ac85a" />

    <!-- brush -->
    <g transform="rotate(38 40 42)">
        <rect x="37" y="26" width="6" height="20" rx="2" fill="url(#pt-handle)" />
        <rect x="36.2" y="45" width="7.6" height="5" rx="1.2" fill="#b8bdc4" />
        <path d="M36.6 50h6.8l-1.4 7.5a2.1 2.1 0 0 1-4 0z" fill="#8e44ad" />
    </g>
</svg>
