{{/* Guestbook icon - a little plaza of visitors, StreetPass style */}}
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
        <linearGradient id="gb-board" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fdfdfd" />
            <stop offset="100%" stop-color="#e2e6ea" />
        </linearGradient>
        <linearGradient id="gb-sky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8fd0f5" />
            <stop offset="100%" stop-color="#cfeafc" />
        </linearGradient>
    </defs>

    <rect x="6" y="7" width="52" height="50" rx="6" fill="url(#gb-board)" stroke="#b7bec6" stroke-width="1.5" />
    <rect x="10" y="11" width="44" height="24" rx="3" fill="url(#gb-sky)" />

    <!-- three visitors standing in the plaza -->
    <g>
        <circle cx="21" cy="24" r="4.4" fill="#f2b47a" />
        <path d="M14 34c0-4 3.2-6.6 7-6.6s7 2.6 7 6.6z" fill="#e0524a" />
    </g>
    <g>
        <circle cx="32" cy="21" r="5" fill="#f6c9a0" />
        <path d="M24 34c0-4.6 3.6-7.6 8-7.6s8 3 8 7.6z" fill="#4a90e2" />
    </g>
    <g>
        <circle cx="43" cy="24" r="4.4" fill="#d79b6b" />
        <path d="M36 34c0-4 3.2-6.6 7-6.6s7 2.6 7 6.6z" fill="#5ac85a" />
    </g>

    <!-- signature lines below -->
    <line x1="12" y1="42" x2="46" y2="42" stroke="#c3cad2" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="47" x2="52" y2="47" stroke="#c3cad2" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="52" x2="38" y2="52" stroke="#c3cad2" stroke-width="2" stroke-linecap="round" />
</svg>
