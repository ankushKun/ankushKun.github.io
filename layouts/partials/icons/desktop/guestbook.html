{{/* Guestbook Desktop Icon - 64x64 SVG - Ultra Skeuomorphic Style
     An open guest book with signatures on the pages and a pen resting across it.
     Matches the paper family (Resume, Blogs) rather than a flat app tile. */}}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
    <defs>
        <linearGradient id="gbPageL" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#e6e1d4" />
            <stop offset="18%" style="stop-color:#fdfbf4" />
            <stop offset="100%" style="stop-color:#f4f0e4" />
        </linearGradient>
        <linearGradient id="gbPageR" x1="100%" y1="0%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:#e6e1d4" />
            <stop offset="18%" style="stop-color:#fdfbf4" />
            <stop offset="100%" style="stop-color:#f4f0e4" />
        </linearGradient>
        <linearGradient id="gbCover" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#8c3d3a" />
            <stop offset="55%" style="stop-color:#6d2a28" />
            <stop offset="100%" style="stop-color:#4a1a19" />
        </linearGradient>
        <linearGradient id="gbGutter" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:rgba(0,0,0,0)" />
            <stop offset="50%" style="stop-color:rgba(0,0,0,0.22)" />
            <stop offset="100%" style="stop-color:rgba(0,0,0,0)" />
        </linearGradient>
        <linearGradient id="gbPen" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4a5058" />
            <stop offset="45%" style="stop-color:#767e88" />
            <stop offset="100%" style="stop-color:#333940" />
        </linearGradient>
        <linearGradient id="gbGloss" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.65)" />
            <stop offset="45%" style="stop-color:rgba(255,255,255,0.06)" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0)" />
        </linearGradient>

        <filter id="gbDropShadow" x="-25%" y="-25%" width="150%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" />
            <feOffset dx="0" dy="2" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.36" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <g filter="url(#gbDropShadow)">
        <!-- Hardcover showing behind the pages -->
        <path d="M5 21 Q19 16.5 32 20 Q45 16.5 59 21 L59 50 Q45 45.5 32 49 Q19 45.5 5 50 Z"
              fill="url(#gbCover)" />

        <!-- Left page -->
        <path d="M7.5 22.5 Q19.5 18.6 31 21.9 L31 47.4 Q19.5 44.1 7.5 48 Z"
              fill="url(#gbPageL)" stroke="#cfc9b8" stroke-width="0.4" />
        <!-- Right page -->
        <path d="M56.5 22.5 Q44.5 18.6 33 21.9 L33 47.4 Q44.5 44.1 56.5 48 Z"
              fill="url(#gbPageR)" stroke="#cfc9b8" stroke-width="0.4" />

        <!-- Centre gutter shading -->
        <rect x="28" y="20" width="8" height="28" fill="url(#gbGutter)" />
        <path d="M32 20.6 L32 48.4" stroke="#b9b2a0" stroke-width="0.6" />

        <!-- Ruled lines, curving with the page -->
        <g stroke="#c8c2b0" stroke-width="0.7" stroke-linecap="round" fill="none">
            <path d="M10.5 28 Q20 25.4 29 27.6" />
            <path d="M10.5 33 Q20 30.4 29 32.6" />
            <path d="M10.5 38 Q20 35.4 29 37.6" />
            <path d="M10.5 43 Q20 40.4 29 42.6" />
            <path d="M53.5 28 Q44 25.4 35 27.6" />
            <path d="M53.5 33 Q44 30.4 35 32.6" />
            <path d="M53.5 38 Q44 35.4 35 37.6" />
            <path d="M53.5 43 Q44 40.4 35 42.6" />
        </g>

        <!-- Signatures in ink -->
        <g stroke="#3a5c9c" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85">
            <path d="M12 27 q2.6 -2.6 4 0 t3.4 -0.4 q1.6 1.4 3.6 -0.6" />
            <path d="M12 37 q3 -2.4 4.6 0.2 t3.6 -0.6" />
            <path d="M37.5 27 q2.8 -2.6 4.2 0 t3.6 -0.5" />
            <path d="M37.5 32 q2.2 -2.2 3.6 0.2 t3 -0.5 q1.6 1.3 3.4 -0.7" />
        </g>
        <!-- Freshest signature, still wet, under the pen -->
        <path d="M37.5 42 q2.6 -2.4 4 0.2 t3.4 -0.5" stroke="#22345c" stroke-width="1.1"
              stroke-linecap="round" fill="none" />

        <!-- Pen resting across the right page -->
        <g transform="rotate(-31 44 41)">
            <rect x="35.5" y="39.4" width="19" height="3.2" rx="1.6" fill="url(#gbPen)" />
            <rect x="47.5" y="39.4" width="3.2" height="3.2" fill="rgba(255,255,255,0.28)" />
            <path d="M35.5 39.4 L31.6 41 L35.5 42.6 Z" fill="#c9ab63" />
            <path d="M33.4 40.25 L31.6 41 L33.4 41.75 Z" fill="#2a2f36" />
            <rect x="36" y="39.7" width="18" height="0.8" rx="0.4" fill="rgba(255,255,255,0.3)" />
        </g>

        <!-- Gloss across the open spread -->
        <path d="M7.5 22.5 Q19.5 18.6 31 21.9 L31 31 Q19.5 28 7.5 31.6 Z" fill="url(#gbGloss)" />
        <path d="M56.5 22.5 Q44.5 18.6 33 21.9 L33 31 Q44.5 28 56.5 31.6 Z" fill="url(#gbGloss)" />
    </g>
</svg>
