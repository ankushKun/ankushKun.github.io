{{/* TextEdit Desktop Icon - 64x64 SVG - Ultra Skeuomorphic Style
     A sheet of ruled letter paper with a few written lines and a pen lying
     across the corner, after the TextEdit icon. Same paper family as the
     Blogs, Resume and Guestbook icons. */}}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
    <defs>
        <linearGradient id="tePaper" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff" />
            <stop offset="100%" style="stop-color:#eceef1" />
        </linearGradient>
        <linearGradient id="tePenBody" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#5b6470" />
            <stop offset="45%" style="stop-color:#2b3038" />
            <stop offset="100%" style="stop-color:#14171b" />
        </linearGradient>
        <linearGradient id="tePenMetal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#f7f8fa" />
            <stop offset="50%" style="stop-color:#b4bcc6" />
            <stop offset="100%" style="stop-color:#7a838e" />
        </linearGradient>
        <linearGradient id="teGloss" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.7)" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0)" />
        </linearGradient>

        <filter id="teDropShadow" x="-25%" y="-25%" width="150%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" />
            <feOffset dx="0" dy="1.8" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.32" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <g filter="url(#teDropShadow)">
        <!-- Sheet, tilted a touch -->
        <g transform="rotate(-4 32 32)">
            <rect x="13" y="6" width="38" height="52" rx="1" fill="url(#tePaper)" stroke="#c3c8cf"
                stroke-width="0.5" />

            <!-- Margin rule -->
            <path d="M19.5 6 L19.5 58" stroke="#e79a9a" stroke-width="0.6" />

            <!-- Ruled lines -->
            <g stroke="#bcd3ee" stroke-width="0.6">
                <path d="M13 18 H51" />
                <path d="M13 24 H51" />
                <path d="M13 30 H51" />
                <path d="M13 36 H51" />
                <path d="M13 42 H51" />
                <path d="M13 48 H51" />
            </g>

            <!-- Heading and written lines -->
            <rect x="22" y="10.6" width="15" height="2.6" rx="1.3" fill="#2c3338" />
            <g stroke="#56606b" stroke-width="1.3" stroke-linecap="round">
                <path d="M22 16.6 H46" />
                <path d="M22 22.6 H44" />
                <path d="M22 28.6 H47" />
                <path d="M22 34.6 H40" />
                <path d="M22 40.6 H45" />
                <path d="M22 46.6 H33" />
            </g>

            <!-- Gloss on the top of the sheet -->
            <rect x="13" y="6" width="38" height="16" rx="1" fill="url(#teGloss)" opacity="0.5" />
        </g>

        <!-- Pen lying across the lower right corner, nib on the last line -->
        <g transform="rotate(-42 44 44)">
            <rect x="34" y="42" width="24" height="4.4" rx="2.2" fill="url(#tePenBody)" />
            <rect x="34.6" y="42.5" width="22.6" height="1" rx="0.5" fill="rgba(255,255,255,0.28)" />
            <rect x="35.4" y="42" width="3.4" height="4.4" fill="url(#tePenMetal)" />
            <path d="M35.4 42 L28.6 44.2 L35.4 46.4 Z" fill="url(#tePenMetal)" stroke="#6d7680" stroke-width="0.3" />
            <path d="M33.4 44.2 L28.6 44.2" stroke="#3c434b" stroke-width="0.45" />
            <rect x="50" y="41.4" width="1.6" height="5.6" rx="0.5" fill="url(#tePenMetal)" />
        </g>
    </g>
</svg>
