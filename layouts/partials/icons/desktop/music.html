{{/* Music Desktop Icon - 64x64 SVG - Ultra Skeuomorphic Style
     A vinyl record with a glossy label and a slight tilt, matching the
     free-floating desktop icon family rather than a flat app tile. */}}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
    <defs>
        <radialGradient id="muVinyl" cx="42%" cy="38%" r="62%">
            <stop offset="0%" style="stop-color:#3a3a3e" />
            <stop offset="55%" style="stop-color:#1a1a1e" />
            <stop offset="100%" style="stop-color:#0a0a0c" />
        </radialGradient>
        <radialGradient id="muLabel" cx="40%" cy="35%" r="65%">
            <stop offset="0%" style="stop-color:#f0c96a" />
            <stop offset="55%" style="stop-color:#d4a03a" />
            <stop offset="100%" style="stop-color:#a87828" />
        </radialGradient>
        <linearGradient id="muGloss" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.45)" />
            <stop offset="45%" style="stop-color:rgba(255,255,255,0.05)" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0)" />
        </linearGradient>
        <filter id="muDropShadow" x="-25%" y="-25%" width="150%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" />
            <feOffset dx="0" dy="2" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.36" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <g filter="url(#muDropShadow)" transform="rotate(-8 32 32)">
        <circle cx="32" cy="32" r="22" fill="url(#muVinyl)" />
        <!-- Groove rings -->
        <circle cx="32" cy="32" r="19" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.7" />
        <circle cx="32" cy="32" r="16.5" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.6" />
        <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.6" />
        <circle cx="32" cy="32" r="11.5" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.8" />
        <!-- Label -->
        <circle cx="32" cy="32" r="8" fill="url(#muLabel)" stroke="#8a6420" stroke-width="0.5" />
        <circle cx="32" cy="32" r="1.6" fill="#1a1a1e" />
        <!-- Gloss -->
        <path d="M14 22 A20 20 0 0 1 48 18 L46 28 A16 16 0 0 0 18 30 Z" fill="url(#muGloss)" />
    </g>
</svg>
