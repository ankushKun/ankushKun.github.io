<div class="desktop-sticky-note" id="desktop-sticky-note" data-cursor-anchor="sticky" hidden>
    <div class="sticky-titlebar">
        <button type="button" class="sticky-close" aria-label="Minimize sticky note"></button>
        <span class="sticky-title">Sticky Note</span>
    </div>
    <textarea class="sticky-body" spellcheck="true" placeholder="Leave a note for everyone…" rows="7"></textarea>
    <div class="sticky-footer">
        <span class="sticky-status" aria-live="polite"></span>
    </div>
</div>
