<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Developers felt 20 percent faster and were 19 percent slower</title>
  <desc id="d">In METR's randomized controlled trial, sixteen experienced open-source developers forecast that AI tools would make them 24 percent faster. After doing 246 real tasks they believed they had been 20 percent faster. Measured, they took 19 percent longer with AI than without it.</desc>
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="28" y="40" font-size="19" font-weight="600" fill="#4e4646">Sixteen experienced developers, 246 real tasks</text>
  <text x="28" y="63" font-size="13.5" fill="#8a9aa2">Effect of AI tools on how long the work took</text>
  <text x="28" y="149" font-size="15" fill="#4e4646">Before: what they forecast</text>
  <path d="M 470 133 H 662.8 a 4 4 0 0 1 4 4 V 151 a 4 4 0 0 1 -4 4 H 470 Z" fill="#01b4c8"/>
  <text x="678.8" y="149" font-size="15" font-weight="600" fill="#4e4646" text-anchor="start">+24%</text>
  <text x="28" y="213" font-size="15" fill="#4e4646">After: what they believed</text>
  <path d="M 470 197 H 630 a 4 4 0 0 1 4 4 V 215 a 4 4 0 0 1 -4 4 H 470 Z" fill="#01b4c8"/>
  <text x="646" y="213" font-size="15" font-weight="600" fill="#4e4646" text-anchor="start">+20%</text>
  <text x="28" y="277" font-size="15" fill="#4e4646">Measured: what happened</text>
  <path d="M 470 261 H 318.20000000000005 a 4 4 0 0 0 -4 4 V 279 a 4 4 0 0 0 4 4 H 470 Z" fill="#eb6834"/>
  <text x="302.20000000000005" y="277" font-size="15" font-weight="600" fill="#4e4646" text-anchor="end">-19%</text>
  <line x1="470" y1="98" x2="470" y2="288" stroke="#8a9aa2" stroke-width="1"/>
  <text x="480" y="308" font-size="12" fill="#8a9aa2">faster with AI</text>
  <text x="460" y="308" font-size="12" fill="#8a9aa2" text-anchor="end">slower with AI</text>
  <text x="28" y="354" font-size="12" fill="#8a9aa2">METR randomized controlled trial, July 2025.</text>
</svg>
