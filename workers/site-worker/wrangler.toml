name = "ankush-site-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Origins allowed to embed the proxy and to call /check and /gif (comma separated).
# Production only; for a local Hugo server pass
# --var SITE_ORIGINS:https://ankush.one,http://localhost:1313 to wrangler dev.
SITE_ORIGINS = "https://ankush.one"
# {"hosts": ["github.com", ...]} generated by the Hugo build. Fails closed if unreachable.
ALLOWLIST_URL = "https://ankush.one/external-hosts.json"
# Extra hosts (comma separated) allowed in addition to the generated list.
EXTRA_HOSTS = ""
# Site the /mcp server reads (index.json and the <page>index.md twins).
SITE_URL = "https://ankush.one"

# Per-IP limit for POST /mcp, GET /search and /gif/* (a separate key each, per
# Cloudflare location). The code skips the
# check when the binding is missing, so this block can be removed if the
# account's plan refuses it.
[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "4201"
  [ratelimits.simple]
  limit = 60
  period = 60

# Secret (not a var): npx wrangler secret put KLIPY_API_KEY
