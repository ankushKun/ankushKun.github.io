<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- Schedule Call: a cherry-red rotary desk telephone. Source for static/icons/book-a-call.webp -->
<defs>
  <linearGradient id="bakelite" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0523f"/><stop offset=".3" stop-color="#d42a1c"/><stop offset=".75" stop-color="#a5150c"/><stop offset="1" stop-color="#6e0a05"/>
  </linearGradient>
  <linearGradient id="bakeliteSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".18" stop-color="#000" stop-opacity="0"/><stop offset=".82" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff8a74"/><stop offset="1" stop-color="#e2412f"/>
  </linearGradient>
  <linearGradient id="handsetG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff7a64"/><stop offset=".25" stop-color="#e8372a"/><stop offset=".7" stop-color="#b4180e"/><stop offset="1" stop-color="#7a0b06"/>
  </linearGradient>
  <linearGradient id="hsGloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="chrome" cx=".4" cy=".3" r=".8">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#d7dce2"/><stop offset=".7" stop-color="#8d949c"/><stop offset="1" stop-color="#e7eaee"/>
  </radialGradient>
  <linearGradient id="chromeRing" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbfcfd"/><stop offset=".3" stop-color="#a9b0b8"/><stop offset=".55" stop-color="#eef1f4"/><stop offset=".8" stop-color="#6f767e"/><stop offset="1" stop-color="#cfd4da"/>
  </linearGradient>
  <radialGradient id="card" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#e9e2cf"/></radialGradient>
  <radialGradient id="label" cx=".45" cy=".35" r=".7"><stop offset="0" stop-color="#fffef8"/><stop offset="1" stop-color="#ddd5bf"/></radialGradient>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="5"/>
    <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="contact" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="plastic" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="2" result="n"/>
    <feDiffuseLighting in="n" surfaceScale=".5" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="70"/></feDiffuseLighting>
    <feComposite in="l" in2="SourceGraphic" operator="arithmetic" k1="1.05" k2="0" k3="0" k4="0" result="m"/>
    <feComposite in="m" in2="SourceAlpha" operator="in"/>
  </filter>
  <clipPath id="bodyClip"><path d="M70 118Q74 104 90 104H166Q182 104 186 118L222 206Q228 224 208 224H48Q28 224 34 206Z"/></clipPath>
  <clipPath id="dialClip"><ellipse cx="128" cy="168" rx="51" ry="45.9"/></clipPath>
  <mask id="wheel"><ellipse cx="128" cy="168" rx="51" ry="45.9" fill="#fff"/><path d="M137.65 139.55a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM120.67 135.17a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM103.4 138.47a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM89.87 148.69a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM83.26 163.43a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM85.1 179.24a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM94.98 192.41a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM110.57 199.87a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM128.23 199.87a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0ZM143.82 192.41a8.6 8.1 0 1 0 17.2 0a8.6 8.1 0 1 0 -17.2 0Z" fill="#000"/><ellipse cx="128" cy="168" rx="19" ry="17.1" fill="#000"/></mask>
</defs>
<ellipse cx="128" cy="230" rx="100" ry="8" fill="#000" opacity=".5" filter="url(#contact)"/>
<!-- body -->
<g filter="url(#drop)">
  <path d="M70 118Q74 104 90 104H166Q182 104 186 118L222 206Q228 224 208 224H48Q28 224 34 206Z" fill="url(#bakelite)" filter="url(#plastic)"/>
  <path d="M70 118Q74 104 90 104H166Q182 104 186 118L222 206Q228 224 208 224H48Q28 224 34 206Z" fill="url(#bakeliteSide)"/>
</g>
<g clip-path="url(#bodyClip)">
  <path d="M76 116Q80 106 92 106H164Q176 106 180 116L184 128Q128 120 72 128Z" fill="url(#topFace)" opacity=".85"/>
  <path d="M72 128Q128 120 184 128" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.4"/>
  <path d="M40 200Q128 190 216 200" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="10" filter="url(#soft)"/>
  <path d="M34 214L222 214" stroke="#ff9d8c" stroke-opacity=".35" stroke-width="1.4"/>
</g>
