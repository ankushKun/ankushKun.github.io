# Every window on the desktop. Order matters: it is the order of the Dock,
# the desktop icons and the Go menu.
#
#   desktop: true   an icon on the desktop: IRC Chat and Music
#   dock: true      in the Dock (phones included): the content apps and All Apps
#   group: games    listed in the Games folder
#   searchable      in Spotlight
# Everything is also in All Apps (the Launchpad), whatever the flags.
apps:
  # Every app in one grid, Mavericks' Launchpad (layouts/partials/apps/
  # games/grid.html with "all"). In the Dock.
  - id: launchpad
    label: All Apps
    title: All Apps
    type: app
    description: Every app on this site in one place
    desktop: false
    dock: true
    searchable: true
    aliases: [apps, all-apps, fun, toys, extras]
    defaultSize:
      width: 760
      height: 560
    icon:
      type: partial
      partial: icons/desktop/launchpad.html

  # The retired Contacts and Now apps live on as aliases, so old
  # /?open=contact and /?open=now links land here (and /contact/ redirects).
  # The window is the front page: who this is, what is going on now, the
  # strongest work, what is new, and how to get in touch.
  - id: about
    label: About Me
    title: About Me
    type: app
    description: About Ankush
    desktop: false
    dock: true
    searchable: true
    contentPermalink: /about/
    aliases: [contact, contacts, now, home, me]
    defaultSize:
      width: 860
      height: 700
    icon:
      type: image
      src: /pfp-128.webp
      fit: cover

  # The window body is the page at /resume/ (data/resume.yaml rendered by
  # layouts/partials/apps/resume/page.html); /resume.pdf stays the download.
  - id: resume
    label: Resume
    title: Resume
    type: app
    description: Experience, projects, skills and education, with the PDF to download
    desktop: false
    dock: true
    searchable: true
    contentPermalink: /resume/
    aliases: [cv, resume.pdf]
    defaultSize:
      width: 860
      height: 720
    icon:
      type: image
      src: /icons/resume.png

