# The resume, as data. Rendered at /resume/ and in the Resume window
# (layouts/partials/apps/resume/page.html), as markdown at /resume/index.md
# (body.md) and as structured data (jsonld.html). Printing /resume/ makes
# static/resume.pdf, so this file is the single source for both.
#
# `summary`, `about`, `highlights` and publication `detail` lines are inline
# markdown: **bold** and [links](https://...) work. Links to pages of this
# site are root-relative. In print, links show their visible text, so any URL
# a recruiter must see is written out as text.
#
# Dates are "YYYY-MM" (or "YYYY" when only the year is known). The template
# prints them as "Feb 2026" and keeps the raw value in <time datetime>. Leave
# `end` out for a current role.
#
# The PDF is ATS-first: one column, standard headings, month-year dates, URLs
# written out as text. Keep every claim checkable from a public source.

name: Ankush Singh
headline: "Co-founder & CTO at Construct Computer | Full-Stack AI Agent Engineer | TypeScript, Cloudflare Workers, MCP"
# Printed as plain text in front of the contact links
location: "India | Remote"

summary: >-
  Co-founder and CTO who builds AI agent products end to end, from the agent
  runtime and evals to the interface people use. Architected and wrote most of
  Construct Computer, where each AI employee gets its own cloud computer, on
  TypeScript, React, Cloudflare Workers, Durable Objects and the Model Context
  Protocol (MCP); it launched as **#1 Product of the Day on Product Hunt**.
  Shipping production software since 2022 across AI agents, LLM evals,
  developer tools and Solana, with a product acquired by Forward Research
  (BetterIDEa), 14 published npm packages (~19K downloads) and 13 hackathon
  and coding-competition wins.

