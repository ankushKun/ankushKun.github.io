experience:
  - org: Construct Computer
    url: https://construct.computer
    role: Co-founder & CTO
    location: Remote, India
    start: "2026-02"
    # One plain line under the role heading that says what the company is.
    about: "A workforce of AI employees that each get their own cloud computer, on a desktop where you can watch them work and take over; paid plans from $9/month."
    highlights:
      - "Architected and wrote most of the platform: a TypeScript monorepo with an agent runtime on Cloudflare Workers and Durable Objects, a React desktop where users watch agents live over WebSockets, MCP apps, long-term memory and reusable workflows."
      - "Migrated the backend from a Docker-container-per-user VPS monolith to Cloudflare Workers, Durable Objects, Containers, R2 and D1 in ~10 days, retiring ~1,300 lines of container code so cost tracks work, not signups; later rebuilt it as v2 and moved every user."
      - "Hardened agent tool use: commands run in disposable sandboxes as a least-privilege user (no sudo, per-command elevation) with live user takeover; open-sourced Foxwatch, the Cloudflare monitor behind status.construct.computer."
      - "Shipped the Jev decision model into memory entity resolution 5 days after release: one 358 to 611 ms call replaced up to 3 calls to a JSON-schema-constrained Llama 4 Scout judge on Workers AI (now the fallback), at ~$0.017 per 1,000 decisions."
      - "First-authored [Construct Technical Report 2026-01](https://construct.computer/blog/clef-vs-jev-benchmark/), a drop-in model-swap study of Clef and Clef-flash vs Jev (117 synthetic cases, 1,053 calls), and open-sourced CWAB, a deterministic benchmark running Construct, OpenClaw and Hermes Agent on 5 LLMs."
      - "Built and launched NepoNet (nepotism.network) within four weeks of the Construct launch: a warm-intro finder for X with a remote MCP server (OAuth), an OpenAPI tools API, llms.txt and an Agent Skill for coding agents; #9 Product of the Day."
    tech: [TypeScript, React, Hono, Cloudflare Workers, Durable Objects, Agents SDK, Sandboxes, Workers AI, Vectorize, D1, R2, MCP]

  - org: Self-employed
    role: Independent Developer
    location: Remote, India
    start: "2025-11"
    end: "2026-02"
    highlights:
      - "Built PumpMyClaw, a platform that runs autonomous AI trading agents (OpenClaw with 5 skills) on Solana and Monad, each in its own isolated Docker container, a design later carried into Construct's first version."
      - "Built pixels.earth, a real-time on-chain pixel canvas on Solana using MagicBlock ephemeral rollups and Anchor programs, and published create-magicblock, a CLI that scaffolds working MagicBlock apps (1,310 npm downloads)."
    tech: [TypeScript, Rust, Anchor, Solana, MagicBlock, Docker, OpenClaw, React, Node.js]

  - org: Forward Research (Arweave / AO)
    url: https://fwd.arweave.net
    role: Entrepreneur in Residence
    location: Remote, India
    start: "2024-11"
    end: "2025-10"
    highlights:
      - "Joined after Forward Research, the team behind AO, acquired BetterIDEa; rewrote the IDE for HyperBEAM with a rebuilt terminal and a GraphQL explorer (its @betteridea/codecell package has 3,717 npm downloads)."
      - "Made the AO Package Manager (APM) part of AO's core: 6 merged PRs to permaweb/aos (2024 to 2025), including #454, which loads APM by default in every new aos process; the apm-tool CLI has 2,104 npm downloads."
      - "Built WAuth, a social-login SDK (Google, X, GitHub, Discord) with invisible non-custodial wallets (~5,300 npm downloads), later handed to ArLink Labs and rebuilt on Cloudflare Workers as ArlinkAuth."
      - "Shipped Subspace (Discord-style chat on AO), Visual AO (flow-based programming) and the ao-fetch and LuaX developer libraries."
    tech: [TypeScript, React, Next.js, Node.js, Lua, GraphQL, OAuth, Arweave, AO, HyperBEAM]

  - org: Arweave India
    url: https://arweaveindia.com
    role: Developer Relations Engineer
    location: Remote, India
    start: "2024-06"
    end: "2025-04"
    highlights:
