      - "Co-organised hackerhouse cohorts, built their cohort and agenda pages, mentored 100+ developers shipping on Arweave and AO, and judged 40+ builds at Longview Labs' Arweave Full Stack Hack."
    tech: [React, Next.js, Express.js, Tailwind CSS, Arweave, AO]

