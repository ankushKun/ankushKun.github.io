# The resume, as data. Rendered at /resume/ and in the Resume window
# (layouts/partials/apps/resume/page.html), as markdown at /resume/index.md
# (body.md) and as structured data (jsonld.html). Printing /resume/ makes
# static/resume.pdf, so this file is the single source for both.
#
# The layout follows Jake's Resume, the usual one-page format for software
# engineers: US Letter, one column, "Company | Role" with the dates on the
# right of the same line. Keep it to one page: short bullets, three or four
# for the current role and one or two for older ones.
#
# `summary` and `highlights` are inline markdown: **bold** and
# [links](https://...) work. Links to pages of this site are root-relative.
# Dates are "YYYY-MM" (printed as "Feb 2026"); leave `end` out for a current
# role.

