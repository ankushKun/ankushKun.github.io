      - "Grew it into a developer tooling suite with npm packages, a CLI, documentation and the AO Package Manager (APM) through the three-month Arweave India Launchpad, and demoed it at Demo Day (Jul 2024); Forward Research then acquired it."
    tech: [TypeScript, React, Next.js, Lua, AO, Arweave]

